<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>saigo(b5c192)引擎吞吐基准</title>
<style>
  body { font: 13px/1.5 Consolas, monospace; background: #111; color: #cde; margin: 16px; }
  .hl { color: #fd5; } .err { color: #f66; }
  #log { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>saigo.online 生产引擎(b5c192 · v17 · saigo_net wasm)吞吐基准</h1>
<pre id="log"></pre>
<script type="module">
const $ = () => document.getElementById('log');
function log(text, cls = '') {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = `[${new Date().toISOString().slice(11, 19)}] ${text}`;
  $('log').appendChild(div);
}
/* GPU 使用探测:worker 里的 requestAdapter 看不到,但宿主 hook 能确认本页无 GPU 请求;
 * worker 是否用 WebGPU 由对照实验(--disable-webgpu)判定 */
if (navigator.gpu) {
  const orig = navigator.gpu.requestAdapter.bind(navigator.gpu);
  navigator.gpu.requestAdapter = async (...a) => { log('[hook] 主线程 requestAdapter 被调用'); return orig(...a); };
}

const report = { startedAt: new Date().toISOString(), coi: self.crossOriginIsolated, ua: navigator.userAgent, rows: [] };
const finish = () => {
  report.finishedAt = new Date().toISOString();
  report.log = [...$('log').children].map((d) => d.textContent);
  fetch('/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phase: 'saigo-bench2', ...report }) }).catch(() => {});
};

function log2(text, cls = '') { log(text, cls); }

async function main() {
  log(`COI=${self.crossOriginIsolated} GPU=${!!navigator.gpu} cores=${navigator.hardwareConcurrency}`, 'hl');
  const BASE = './saigo-assets/workers/';
  const WORKER_URL = BASE + 'engine.worker.js';
  const NET_URL = './saigo-assets/saigo-net.bin';

  const [netBuf] = await Promise.all([fetch(NET_URL).then((r) => r.arrayBuffer())]);
  log(`net ${(netBuf.byteLength / 1048576).toFixed(1)}MB 已载入`);

  const worker = new Worker(WORKER_URL, { type: 'classic' });
  let id = 0;
  const pending = new Map();
  worker.onmessage = (e) => {
    const p = pending.get(e.data.id);
    if (!p) return;
    pending.delete(e.data.id);
    e.data.ok ? p.res(e.data.result) : p.rej(new Error(e.data.error));
  };
  worker.onerror = (ev) => log('WORKER FATAL: ' + (ev.message || ''), 'err');
  const call = (msg) => new Promise((res, rej) => { const i = ++id; pending.set(i, { res, rej }); worker.postMessage({ id: i, ...msg }); });

  log('init(KataGoNet 加载网络)…', 'hl');
  const tInit0 = performance.now();
  const info = await call({ type: 'init', bytes: new Uint8Array(netBuf) });
  log(`引擎就绪: ${info.name}  visitCap=${info.visitCap}  ${(performance.now() - tInit0).toFixed(0)}ms`, 'hl');

  /* 位置:history 语义 = 从当前局面回退到空盘的着法序列(首元素是最早一手);
   * toMove 按 history 长度交替;A(h) 用 stones 摆子(此处全用空盘/成序列局面) */
  const mkPos = (moves) => {
    const history = moves.map((loc, i) => ({ point: { x: loc % 19, y: (loc / 19) | 0 }, color: i % 2 === 0 ? 'b' : 'w' }));
    return { board: { size: 19 }, toMove: moves.length % 2 === 0 ? 'b' : 'w', komi: 7.5, history, stones: history.map((h) => ({ point: h.point, color: h.color })) };
  };
  const EMPTY = [];
  const MID = [[3,3],[15,15],[3,15],[15,3],[9,9],[3,9],[15,9],[9,3],[9,15],[5,5],[13,13],[5,13],[13,5],[7,7],[11,11],[7,11],[11,7],[2,8],[16,8],[8,2],[8,16],[6,6],[12,12],[6,12],[12,6],[4,4],[14,14]].map(([r,c]) => r*19+c);
  const END = [[0,0],[0,1],[18,18],[18,17],[1,1],[17,17],[9,9],[9,10],[10,9],[10,10],[2,2],[16,16],[3,15],[15,3],[4,4],[14,14],[5,13],[13,5],[6,12],[12,6],[7,11],[11,7],[8,10],[10,8],[9,9],[2,16],[16,2],[3,3],[15,15],[4,14]].map(([r,c]) => r*19+c);
  const NAMES = ['空盘', '中盘27手', '官子30手'];
  const POS = [EMPTY, MID, END];

  // 一次 genMove 冒烟(确认前向真的在跑)
  const gm = await call({ type: 'genMove', pos: mkPos(MID), opts: {} });
  log(`genMove 冒烟: top=${gm.move.point ? `(${gm.move.point.x},${gm.move.point.y})` : 'pass'} win黑=${(gm.evaluation.winrateBlack * 100).toFixed(1)}%`, 'hl');

  for (let i = 0; i < POS.length; i++) {
    const pos = mkPos(POS[i]);
    for (let w = 0; w < 3; w++) await call({ type: 'evaluate', pos });   // 预热
    const N = 30, times = [];
    for (let k = 0; k < N; k++) {
      const t0 = performance.now();
      await call({ type: 'evaluate', pos });
      times.push(performance.now() - t0);
    }
    times.sort((a, b) => a - b);
    const min = times[0], p50 = times[(N - 1) >> 1];
    const eps = 1000 / p50;
    report.rows.push({ pos: NAMES[i], minMs: +min.toFixed(2), p50Ms: +p50.toFixed(2), evalsPerSec: +eps.toFixed(1) });
    log(`${NAMES[i]}: 单次前向 min ${min.toFixed(1)}ms / p50 ${p50.toFixed(1)}ms → ${eps.toFixed(0)} evals/s`, 'hl');
  }
    log('BENCH DONE', 'hl');
    finish();
} 

main().catch((e) => { log('FATAL: ' + (e.stack || e), 'err'); report.error = String(e && (e.stack || e) || e); finish(); });
</script>
</body>
</html>
