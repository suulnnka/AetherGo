# AetherGo N3 gatekeeper(9×9 学生网淘汰赛)
# 新一代学生必须在等 visits 对弈中赢过上一代才发布(NEURAL_PLAN N3)。
# 口径与 selfplay_aether9.cfg 完全一致(POSITIONAL 禁全同 / 面积 / 贴 5.5)。

onnxProvider = cuda

logSearchInfo = false
logMoves = false
logGamesEvery = 10
logToStdout = true
numGameThreads = 8
maxMovesPerGame = 200
numGamesPerGating = 100
allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 5

koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = false
hasButtons = false
bSizes = 9
bSizeRelProbs = 1
allowRectangleProb = 0.0
komiAuto = false
komiMean = 5.5
handicapProb = 0.0
handicapCompensateKomiProb = 0.0

maxVisits = 150
numSearchThreads = 1
nnMaxBatchSize = 128
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 14
numNNServerThreadsPerModel = 1
nnRandomize = true
cudaUseFP16 = auto
cudaUseNHWC = auto

# gatekeeper 无额外专属键:numGamesPerGating 即淘汰赛的每对局数(模板同款)
