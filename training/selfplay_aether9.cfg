# AetherGo 蒸馏数据生成(9×9)—— 老师自对弈
# 口径与 AetherGo JS 引擎严格一致:POSITIONAL 禁全同 / 面积计分 / 禁自杀 / 贴 5.5 / 无让子
# 模板:KataGo/cpp/configs/training/selfplay1_maxsize9.cfg(该文件注释允许训练小盘时同步调小)

# ---- 后端 ----
onnxProvider = cuda

# ---- 数据 ----
dataBoardLen = 9
maxDataQueueSize = 2000
maxRowsPerTrainFile = 10000
firstFileRandMinProp = 0.15
earlyForkGameProb = 0.04
earlyForkGameExpectedMoveProp = 0.025
forkGameProb = 0.0
forkGameMinChoices = 3
earlyForkGameMaxChoices = 12
forkGameMaxChoices = 36
sekiForkHackProb = 0.02
initGamesWithPolicy = true
policyInitAreaProp = 0.12
compensateAfterPolicyInitProb = 0.2
sidePositionProb = 0.0
cheapSearchProb = 0.75
cheapSearchVisits = 4
cheapSearchTargetWeight = 0.0
reduceVisits = true
reduceVisitsThreshold = 0.9
reduceVisitsThresholdLookback = 3
reducedVisitsMin = 4
reducedVisitsWeight = 0.1
handicapAsymmetricPlayoutProb = 0.0
normalAsymmetricPlayoutProb = 0.0
maxAsymmetricRatio = 8.0
minAsymmetricCompensateKomiProb = 0.4
policySurpriseDataWeight = 0.5
valueSurpriseDataWeight = 0.1
estimateLeadProb = 0.0
switchNetsMidGame = true
fancyKomiVarying = true

# ---- 对局 ----
numGameThreads = 8
maxMovesPerGame = 120
# 规则:固定单一取值(逗号列表会逐局随机 —— 我们要确定性口径)
koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = false
hasButtons = false
bSizes = 9
bSizeRelProbs = 1
allowRectangleProb = 0.0
komiAuto = false
komiMean = 5.5
komiStdev = 0.75
komiBigStdevProb = 0.0
komiBigStdev = 0.0
komiBiggerStdevProb = 0.0
handicapProb = 0.0
forkCompensateKomiProb = 0.80
sgfCompensateKomiProb = 0.90
drawRandRadius = 0.0
noResultStdev = 0.166666666

# ---- 搜索 / NN ----
maxVisits = 8
numSearchThreads = 1
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 14
numNNServerThreadsPerModel = 1
nnRandomize = true
cudaUseFP16 = auto
cudaUseNHWC = auto

# ---- 温度与噪声(蒸馏要的是访问分布,保留自对弈随机性) ----
chosenMoveTemperatureEarly = 1.0
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.15
chosenMoveSubtract = 0
chosenMovePrune = 1
rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.35
rootDesiredPerChildVisitsCoeff = 2
rootNumSymmetriesToSample = 1
useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15
winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.00
dynamicScoreUtilityFactor = 0.40
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5
rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true
rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1
cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0
numVirtualLossesPerThread = 1
valueWeightExponent = 0.5
subtreeValueBiasFactor = 0.30
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true
fpuParentWeightByVisitedPolicy = true

# ---- 日志 ----
logSearchInfo = false
logMoves = false
logGamesEvery = 1
logToStdout = true
logToStderr = false
