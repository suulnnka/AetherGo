# AetherGo 特征对拍专用:一切「额外训练行」的机制全部关闭
# (fork / cheap search / side position / policy 开局 / lead 估计 / 让子),
# 保证 npz 每一行 = SGF 每一手的落子前局面。规则口径与 selfplay_aether9.cfg 相同。

# ---- 后端 ----
onnxProvider = cuda

# ---- 数据 ----
dataBoardLen = 9
maxDataQueueSize = 200
maxRowsPerTrainFile = 100000
firstFileRandMinProp = 0.0
earlyForkGameProb = 0.0
forkGameProb = 0.0
sekiForkHackProb = 0.0
initGamesWithPolicy = false
sidePositionProb = 0.0
cheapSearchProb = 0.0
reduceVisits = false
handicapAsymmetricPlayoutProb = 0.0
normalAsymmetricPlayoutProb = 0.0
policySurpriseDataWeight = 0.0
valueSurpriseDataWeight = 0.0
estimateLeadProb = 0.0
switchNetsMidGame = false
fancyKomiVarying = false

# ---- 对局 ----
numGameThreads = 1
maxMovesPerGame = 200
koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = false
hasButtons = false
bSizes = 9
bSizeRelProbs = 1
allowRectangleProb = 0.0
komiAuto = false
komiMean = 5.5
komiStdev = 0.0
komiBigStdevProb = 0.0
handicapProb = 0.0
forkCompensateKomiProb = 0.0
sgfCompensateKomiProb = 0.0
drawRandRadius = 0.0
noResultStdev = 0.166666666

# ---- 搜索 / NN(低 visits 即可,对拍只看特征不看强度) ----
maxVisits = 60
numSearchThreads = 1
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 12
numNNServerThreadsPerModel = 1
nnRandomize = false
allowResignation = false

chosenMoveTemperatureEarly = 0.75
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.15
chosenMoveSubtract = 0
chosenMovePrune = 1
rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.25
rootDesiredPerChildVisitsCoeff = 2
rootNumSymmetriesToSample = 1
useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15
winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.00
dynamicScoreUtilityFactor = 0.40
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5
rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true
rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1
cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0
numVirtualLossesPerThread = 1
valueWeightExponent = 0.5
subtreeValueBiasFactor = 0.30
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true
fpuParentWeightByVisitedPolicy = true

# ---- 日志 ----
logSearchInfo = false
logMoves = false
logGamesEvery = 1
logToStdout = true
logToStderr = false
